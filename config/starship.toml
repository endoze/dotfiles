# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = 'solarized'
command_timeout = 500

# Starship's default format is "$all", which renders custom modules after every
# language module. That would leave the jj/git segment drifting to the far end
# of the prompt in project repos. This is the default "$all" expansion with
# "$custom" dropped and "${custom.jj}" moved up beside "$directory", so VCS info
# stays where git_branch used to sit. Re-derive with `starship print-config`
# if a starship upgrade adds new modules.
format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory${custom.jj}$vcsh$fossil_branch$fossil_metrics$git_branch$git_commit$git_state$git_metrics$git_status$hg_branch$hg_state$pijul_channel$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character"

