[custom.jj]
# jj has no "current branch", so this shows the nearest ancestor bookmark plus
# how far @ has drifted from it, and the change id, which is the only identity
# stable across rebase/squash/amend. jj-starship is a native binary that reads
# the jj store directly, so it costs ~0ms; shelling out to the jj CLI instead
# measured ~80ms per prompt. It renders git repos too, which is why
# git_branch and git_commit are disabled below.
when = "jj-starship detect"
# --no-*-prefix drops the leading "on <symbol>"; note it takes the symbol with
# it, since jj-starship treats them as one unit
# --bookmarks-display-limit 1 keeps only the nearest ancestor bookmark. It lists
# every ancestor bookmark by default, which is unreadable on a 5-deep stack. Do
# not use --ancestor-bookmark-depth for this: it caps how far up it *searches*,
# so a small value shows no bookmark at all once @ is several commits above one.
shell = ["jj-starship", "--no-jj-prefix", "--no-git-prefix", "--bookmarks-display-limit", "1"]
format = "$output "

